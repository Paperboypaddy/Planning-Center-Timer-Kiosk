name: Release

# Runs when a release is published (stable or pre-release/beta). Builds the
# Windows app and attaches the artifacts + a source tarball to that release.
# Also verifies the NixOS flake on the tagged commit (NixOS installs pin the
# git tag — there is no separate Nix binary to attach).
# Releases are manual — this never runs on a plain push/commit.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Gate the release: the published tag must be a buildable flake on both
  # Linux arches we support for NixOS kiosks.
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Check Nix formatting
        run: |
          fmt=$(nix build --no-link --print-out-paths ".#formatter.${{ matrix.system }}")
          "$fmt/bin/nixfmt" --check flake.nix nix/*.nix
      - name: Flake check (package + NixOS module eval)
        run: nix flake check -L

  build-windows:
    runs-on: windows-latest
    needs: [nix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the portable app + installer
        shell: powershell
        run: .\installer\windows\build-windows.ps1
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/dist/Planning-Center-Kiosk.exe
            installer/windows/output/KioskSetup.exe

  package-source:
    runs-on: ubuntu-latest
    needs: [nix]
    steps:
      - uses: actions/checkout@v4
      - name: Build the source tarball
        run: git archive --format=tar.gz -o planningcenter-timer-kiosk.tar.gz HEAD
      # The Linux update script (kiosk/update.sh) verifies the tarball against
      # this checksum before it extracts and reinstalls as root.
      - name: Checksum the source tarball
        run: sha256sum planningcenter-timer-kiosk.tar.gz > checksums.txt
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            planningcenter-timer-kiosk.tar.gz
            checksums.txt
