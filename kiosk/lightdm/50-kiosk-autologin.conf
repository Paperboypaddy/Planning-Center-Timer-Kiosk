# Raspberry Pi OS Lite / Debian headless kiosk autologin.
# Adjust the username for your box (e.g. pi on Raspberry Pi OS, raspi on
# a custom image). Requires a matching kiosk.desktop in /usr/share/xsessions
# and a "kiosk" session script (see kiosk-session.sh).
autologin-user=raspi
autologin-session=kiosk
user-session=kiosk
