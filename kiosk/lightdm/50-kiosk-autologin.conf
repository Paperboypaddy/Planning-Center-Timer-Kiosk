# Raspberry Pi OS Lite / Debian headless kiosk autologin.
# Keep this in sync with KIOSK_BROWSER_USER in kiosk/install.sh (default: kiosk).
# Requires a matching kiosk.desktop in /usr/share/xsessions and a "kiosk"
# session script (see kiosk-session.sh).
autologin-user=kiosk
autologin-session=kiosk
user-session=kiosk
