<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <link rel="stylesheet" href="/display.css">
</head>
<body class="theme-dark layout-countdown-full">
  <main id="stage" aria-live="polite">
    <p id="waiting" class="waiting">Waiting for Services LIVE&hellip;</p>
    <div id="timer" class="timer" hidden>
      <div id="clock" class="clock">0:00</div>
      <p id="caption" class="caption"></p>
    </div>
    <p id="fallback" class="fallback" hidden>This layout is not implemented yet. Showing Countdown Full (dark).</p>
  </main>
  <script src="/display.js"></script>
</body>
</html>
